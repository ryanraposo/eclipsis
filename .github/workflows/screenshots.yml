name: Generate Screenshots

on:
  push:

jobs:
  screenshots:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2t64 libxkbcommon0 libnss3 libnspr4 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libgtk-3-0

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Capture screenshots
        run: npm run screenshot

      - name: Capture wireframe screenshot spread
        run: npm run screenshot:wireframe
