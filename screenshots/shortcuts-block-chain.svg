<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Eclipsis Shortcuts block chain</title>
  <desc id="desc">A visual chain of Apple Shortcuts-style blocks for launching Eclipsis through a hosted appclip URL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08131d"/>
      <stop offset="0.48" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#247bd7"/>
      <stop offset="1" stop-color="#7f64ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#18a384"/>
      <stop offset="1" stop-color="#42d7e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="260" cy="100" r="290" fill="#5f9cff" opacity="0.16"/>
  <circle cx="1150" cy="110" r="250" fill="#9877ff" opacity="0.14"/>

  <text x="92" y="92" fill="#8eb6ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3">ECLIPSIS LAUNCHER</text>
  <text x="92" y="152" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="900">Shortcut block chain</text>
  <text x="92" y="198" fill="#a8b8ca" font-family="Inter, Arial, sans-serif" font-size="28">Action Button to hosted HTTPS appclip URL, with live launch status.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="274" width="1216" height="112" rx="28" fill="#1f2a37" stroke="#394b63" stroke-width="3"/>
    <rect x="116" y="300" width="178" height="60" rx="18" fill="url(#blue)"/>
    <text x="150" y="338" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">Shortcut</text>
    <text x="326" y="322" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">Eclipsis</text>
    <text x="326" y="356" fill="#a8b8ca" font-family="Inter, Arial, sans-serif" font-size="22">Runs from Action Button, Back Tap, Siri, or Control Center</text>
    <circle cx="1246" cy="330" r="20" fill="#58dc8b"/>
    <path d="M1236 330l8 8 17-20" fill="none" stroke="#071015" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="166" y="438" width="1068" height="104" rx="24" fill="#f19837"/>
    <rect x="194" y="463" width="102" height="54" rx="16" fill="#ffb75c"/>
    <text x="222" y="498" fill="#241100" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">URL</text>
    <text x="326" y="482" fill="#211100" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="850">https://your-domain.example/appclip</text>
    <text x="326" y="515" fill="#4f2903" font-family="Inter, Arial, sans-serif" font-size="21">?trigger=action-button&amp;topic=ai&amp;listen=1</text>
  </g>

  <path d="M700 392v38" stroke="#76d9ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M682 414l18 18 18-18" fill="none" stroke="#76d9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="236" y="594" width="928" height="104" rx="24" fill="#2f7de1"/>
    <rect x="264" y="619" width="154" height="54" rx="16" fill="#6fb2ff"/>
    <text x="294" y="654" fill="#06111f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">Open</text>
    <text x="450" y="639" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Open URLs</text>
    <text x="450" y="672" fill="#d8e7ff" font-family="Inter, Arial, sans-serif" font-size="21">Launches Safari into the secure Eclipsis voice surface</text>
  </g>

  <path d="M700 548v38" stroke="#76d9ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M682 570l18 18 18-18" fill="none" stroke="#76d9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="316" y="748" width="768" height="72" rx="22" fill="#0e2132" stroke="#76d9ff" stroke-opacity="0.6" stroke-width="3"/>
    <rect x="340" y="770" width="530" height="28" rx="14" fill="#172c42"/>
    <rect x="340" y="770" width="424" height="28" rx="14" fill="url(#green)"/>
    <text x="900" y="793" fill="#dfffe9" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Live status: Ready</text>
  </g>
</svg>
